; EnvMon 固件 - PlatformIO 统一配置
; 版本: v2.0.0
; 支持平台: ESP32 / ESP8266

[platformio]
default_envs = envmon-esp32
; 使用: pio run -e envmon-esp32  (或 envmon-esp8266)
src_dir = .

; ─────────────────────────────────────────────
; 共享库依赖 (所有环境)
; ─────────────────────────────────────────────
[env]
monitor_speed = 115200
; 上传速度, 必要时调低 (如 921600 在 USB-TTL 不稳时)
upload_speed = 921600
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.6
    adafruit/Adafruit BME280 Library@^2.3.5
    adafruit/Adafruit BMP280 Library@^2.5.1
    adafruit/DHT sensor library@^1.4.6
    knolleary/PubSubClient@^2.8

; ─────────────────────────────────────────────
; ESP32 环境 (完整功能)
; ─────────────────────────────────────────────
[env:envmon-esp32]
platform = espressif32 @ ~6.7.0
board = esp32dev
framework = arduino
build_src_filter = +<*> +<esp32/*> -<esp8266/*>
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L
; OTA 双分区 (4MB Flash 配置)
board_build.flash_mode = dio
board_build.flash_size = 4MB
; 板载 LED 引脚 (ESP32 DevKit 默认 GPIO 2)
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_ARCH_ESP32
    -DFIRMWARE_VERSION=\"2.0.0\"
    -DFIRMWARE_BUILD=20260909
    -DFIRMWARE_PLATFORM=\"esp32\"
    -DPIN_OLED_SDA=21
    -DPIN_OLED_SCL=22
    -DPIN_DHT=4
    -DPIN_MIC_CLK=34
    -DPIN_MIC_DOUT=32
    -DPIN_MIC_BCLK=25
    -DPIN_DAC0=25
    -DPIN_DAC1=26
    -DPIN_ECG_OUT=34
    -DPIN_ECG_REF=35
    -DPIN_LED=2
    -DPIN_LED2=4
    -DPIN_BUTTON=0
    -DPIN_BUTTON_LONG=5
    -DPLATFORM_SERVER=\"192.168.68.119\"
    -DPLATFORM_PORT=12090
    -DDEVICE_ID=\"esp32-001\"
    -DDEVICE_TOKEN=\"<your-token>\"
    -DREPORT_INTERVAL=60
lib_extra_dirs = lib
; 额外库 (I2S 麦克风/喇叭)
lib_deps =
    ${env.lib_deps}
    ; I2S 麦克风/喇叭库
    ; adafruit/Arduino_Ame@^1.0.0

; ─────────────────────────────────────────────
; ESP8266 环境 (精简功能)
; ─────────────────────────────────────────────
[env:envmon-esp8266]
platform = espressif8266 @ ~4.4.0
board = nodemcudev
framework = arduino
build_src_filter = +<*> +<esp8266/*> -<esp32/*>
; NodeMCU 板型 (4MB Flash)
board_build.f_cpu = 80000000L
board_build.flash_mode = dio
board_build.flash_size = 4MB
build_flags =
    -DARDUINO_ARCH_ESP8266
    -DFF=SPIFFS
    -DFIRMWARE_VERSION=\"2.0.0\"
    -DFIRMWARE_BUILD=20260909
    -DFIRMWARE_PLATFORM=\"esp8266\"
    -DPIN_OLED_SDA=4
    -DPIN_OLED_SCL=5
    -DPIN_DHT=3
    -DPIN_LED=2
    -DPIN_BUTTON=0
    -DPLATFORM_SERVER=\"192.168.68.119\"
    -DPLATFORM_PORT=12090
    -DDEVICE_ID=\"esp8266-001\"
    -DDEVICE_TOKEN=\"<your-token>\"
    -DREPORT_INTERVAL=60
; ESP8266 无 BMP280 / 麦克风 / 喇叭
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.6
    adafruit/DHT sensor library@^1.4.6

; ─────────────────────────────────────────────
; 自定义上传脚本 (可选)
; ─────────────────────────────────────────────
; 使用: pio run -t upload --upload-port /dev/ttyUSB0
;
; 或: pio run -t uploadfs  (仅上传 SPIFFS/LittleFS)
; 或: pio device monitor  (打开串口监视)
