; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp8266
project_dir = .
src_dir = esp8266

[env]
monitor_speed = 115200
upload_speed = 921600
lib_deps = 
	adafruit/Adafruit SSD1306@^2.5.7
	adafruit/Adafruit GFX Library@^1.11.6
	adafruit/Adafruit BME280 Library@^2.3.5
	adafruit/Adafruit BMP280 Library@^2.5.1
	adafruit/DHT sensor library@^1.4.6
	knolleary/PubSubClient@^2.8

[env:esp32]
platform = espressif32 @ ~6.7.0
board = esp32dev
framework = arduino
build_src_filter = +<*> +<esp32/*> -<esp8266/*>
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.flash_size = 4MB
build_flags = 
	-DCORE_DEBUG_LEVEL=1
	-DARDUINO_ARCH_ESP32
	-DFIRMWARE_VERSION=\"2.0.0\"
	-DFIRMWARE_BUILD=20260909
	-DFIRMWARE_PLATFORM=\"esp32\"
	-DPIN_OLED_SDA=21
	-DPIN_OLED_SCL=22
	-DPIN_DHT=4
	-DPIN_MIC_CLK=34
	-DPIN_MIC_DOUT=32
	-DPIN_MIC_BCLK=25
	-DPIN_DAC0=25
	-DPIN_DAC1=26
	-DPIN_ECG_OUT=34
	-DPIN_ECG_REF=35
	-DPIN_LED=2
	-DPIN_LED2=4
	-DPIN_BUTTON=0
	-DPIN_BUTTON_LONG=5
	-DPLATFORM_SERVER=\"192.168.68.119\"
	-DPLATFORM_PORT=12090
	-DDEVICE_ID=\"esp32-001\"
	-DDEVICE_TOKEN=\"dev-token\"
	-DREPORT_INTERVAL=60
lib_extra_dirs = lib
lib_deps = 
	${env.lib_deps}
	bblanchon/ArduinoJson@^6.21.1
	olikraus/U8g2@^2.36.18

[env:esp8266]
platform = espressif8266 @ 4.2.1
board = esp12e
framework = arduino
build_src_filter = +<envmon_esp8266.ino> +<*.cpp> +<*.h>
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
board_build.flash_size = 4MB
build_flags = 
	-DARDUINO_ARCH_ESP8266
	-DFF=SPIFFS
	-DFIRMWARE_VERSION=\"2.0.0\"
	-DFIRMWARE_BUILD=20260909
	-DFIRMWARE_PLATFORM=\"esp8266\"
	-DPLATFORM_SERVER=\"192.168.68.119\"
	-DPLATFORM_PORT=12090
	-DDEVICE_ID=\"esp8266-001\"
	-DDEVICE_TOKEN=\"dev-token\"
	-DREPORT_INTERVAL=60
lib_deps = 
	adafruit/Adafruit SSD1306@^2.5.7
	adafruit/Adafruit GFX Library@^1.11.6
	adafruit/DHT sensor library@^1.4.6
	bblanchon/ArduinoJson@^6.21.1
	olikraus/U8g2@^2.36.18
	earlephilhower/ESP8266Audio@^2.4.1
	/home/hotyuo/.platformio/packages/framework-arduinoespressif8266/libraries/LittleFS

[env:envmon-esp8266-dht-probe]
platform = espressif8266 @ 4.2.1
board = esp12e
framework = arduino
build_src_filter = +<dht_probe/dht_probe.ino> -<*>
board_build.f_cpu = 80000000L
board_build.flash_mode = dio
board_build.flash_size = 4MB
build_flags = 
	-DARDUINO_ARCH_ESP8266
	-DFF=SPIFFS
lib_deps = 
	adafruit/DHT sensor library@^1.4.6
